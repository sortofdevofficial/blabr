<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auth</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; color: #fff; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 8px; width: 300px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #6366f1; border: none; color: white; cursor: pointer; }
        .hidden { display: none; }
        .sess { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid #333; padding: 8px 0; font-size: 12px; color: #ddd; }
        .sess button { width: auto; margin: 0; padding: 6px 10px; font-size: 12px; }
        .sess .meta { color: #888; }
    </style>
</head>
<body>
    <div class="card" id="auth-card">
        <h2 id="title">Login</h2>
        <form id="form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="btn">Login</button>
        </form>
        <form id="otp-form" class="hidden">
            <p id="otp-note" style="color:#aaa; text-align:center; margin:0 0 10px;"></p>
            <input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code" required>
            <button type="submit">Verify</button>
            <p id="resend" style="cursor:pointer; color:#6366f1; text-align:center; margin:10px 0 0;">Resend code</p>
        </form>
        <p id="toggle" style="cursor:pointer; color:#aaa; text-align:center;">Need an account? Register</p>
        <p id="msg" style="color:red; text-align:center;"></p>
    </div>
    <div class="card hidden" id="dash">
        <h2>Logged In!</h2>
        <p id="who" class="meta" style="color:#aaa; text-align:center; margin:0;"></p>
        <h3 style="font-size:12px; color:#888; margin:18px 0 0; text-transform:uppercase; letter-spacing:.06em;">Active logins</h3>
        <div id="sessions"></div>
        <button onclick="logout()">Logout</button>
    </div>
    <script>
        let isLogin = true;
        let pending = null;
        const $ = (id) => document.getElementById(id);

        function loggedIn(token, email) {
            localStorage.setItem('token', token);
            if (email) localStorage.setItem('email', email);
            showDash();
        }

        function clearAuth() {
            localStorage.clear();
            location.reload();
        }

        function ago(t) {
            const d = Math.floor(Date.now() / 1000) - t;
            if (d < 60) return 'just now';
            if (d < 3600) return `${Math.floor(d / 60)}m ago`;
            if (d < 86400) return `${Math.floor(d / 3600)}h ago`;
            return `${Math.floor(d / 86400)}d ago`;
        }

        function showDash() {
            $('auth-card').classList.add('hidden');
            $('dash').classList.remove('hidden');
            $('who').textContent = localStorage.getItem('email') || '';
            loadSessions();
        }

        function renderSessions(list) {
            const box = $('sessions');
            box.textContent = '';
            list.forEach((s) => {
                const row = document.createElement('div');
                row.className = 'sess';

                const info = document.createElement('div');
                const name = document.createElement('strong');
                name.textContent = s.device + (s.current ? ' · this device' : '');
                const meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = `${s.ip} · ${ago(s.last)}`;
                info.append(name, meta);

                const btn = document.createElement('button');
                btn.textContent = 'Log out';
                btn.onclick = () => revokeSession(s.id);

                row.append(info, btn);
                box.append(row);
            });
        }

        async function loadSessions() {
            let out;
            try {
                out = await post({ action: 'sessions' }, localStorage.getItem('token'));
            } catch {
                $('sessions').textContent = 'Network error — could not load devices.';
                return;
            }
            if (out.res.status === 401) return clearAuth();
            if (!out.res.ok) {
                $('sessions').textContent = out.data.error || 'Could not load devices.';
                return;
            }
            renderSessions(out.data.sessions);
        }

        async function revokeSession(id) {
            let out;
            try {
                out = await post({ action: 'revoke', id }, localStorage.getItem('token'));
            } catch {
                return alert('Network error — could not log out that device.');
            }
            if (out.res.status === 401) return clearAuth();
            if (!out.res.ok) return alert(out.data.error || 'Could not log out that device.');
            if (out.data.current) return clearAuth();
            loadSessions();
        }

        async function logout() {
            await post({ action: 'revoke' }, localStorage.getItem('token')).catch(() => {});
            clearAuth();
        }

        function showOtp(note) {
            $('form').classList.add('hidden');
            $('toggle').classList.add('hidden');
            $('otp-form').classList.remove('hidden');
            $('otp-note').textContent = note;
            $('msg').textContent = '';
        }

        async function post(payload, token) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers.Authorization = `Bearer ${token}`;
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers,
                body: JSON.stringify(payload)
            });
            const data = await res.json().catch(() => ({}));
            return { res, data };
        }

        async function sendCode() {
            let out;
            try {
                out = await post({ action: 'register', email: pending.email, password: pending.password });
            } catch {
                return $('msg').textContent = 'Network error — could not reach the server.';
            }
            const { res, data } = out;
            if (!res.ok) return $('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
            showOtp(`Code sent to ${pending.email}`);
        }

        $('toggle').onclick = () => {
            isLogin = !isLogin;
            $('title').textContent = isLogin ? 'Login' : 'Register';
            $('btn').textContent = isLogin ? 'Login' : 'Register';
            $('toggle').textContent = isLogin ? 'Need an account? Register' : 'Already have an account? Login';
            $('msg').textContent = '';
        };

        $('form').onsubmit = async (e) => {
            e.preventDefault();
            const email = $('email').value;
            const password = $('password').value;
            pending = { email, password };

            let out;
            try {
                out = await post({ action: isLogin ? 'login' : 'register', email, password });
            } catch {
                return $('msg').textContent = 'Network error — could not reach the server.';
            }
            const { res, data } = out;

            if (res.ok) {
                if (isLogin) return loggedIn(data.token, data.email);
                return showOtp(`Code sent to ${email}`);
            }
            if (res.status === 403 && data.verify) return showOtp('Enter the code we emailed you.');
            $('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
        };

        $('otp-form').onsubmit = async (e) => {
            e.preventDefault();
            let out;
            try {
                out = await post({ action: 'verify', email: pending.email, otp: $('otp').value.trim() });
            } catch {
                return $('msg').textContent = 'Network error — could not reach the server.';
            }
            const { res, data } = out;
            if (res.ok) return loggedIn(data.token, data.email);
            $('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
        };

        $('resend').onclick = () => {
            if (pending) sendCode();
        };

        if (localStorage.getItem('token')) showDash();
    </script>
</body>
</html>
