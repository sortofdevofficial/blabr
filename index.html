<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auth</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; color: #fff; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 8px; width: 300px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #6366f1; border: none; color: white; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card" id="auth-card">
        <h2 id="title">Login</h2>
        <form id="form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="btn">Login</button>
        </form>
        <form id="otp-form" class="hidden">
            <p id="otp-note" style="color:#aaa; text-align:center; margin:0 0 10px;"></p>
            <input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code" required>
            <button type="submit">Verify</button>
            <p id="resend" style="cursor:pointer; color:#6366f1; text-align:center; margin:10px 0 0;">Resend code</p>
        </form>
        <p id="toggle" style="cursor:pointer; color:#aaa; text-align:center;">Need an account? Register</p>
        <p id="msg" style="color:red; text-align:center;"></p>
    </div>
    <div class="card hidden" id="dash">
        <h2>Logged In!</h2>
        <button onclick="localStorage.clear(); location.reload()">Logout</button>
    </div>
    <script>
        let isLogin = true;
        let pending = null;
        const $ = (id) => document.getElementById(id);

        function loggedIn(token) {
            localStorage.setItem('token', token);
            $('auth-card').classList.add('hidden');
            $('dash').classList.remove('hidden');
        }

        function showOtp(note) {
            $('form').classList.add('hidden');
            $('toggle').classList.add('hidden');
            $('otp-form').classList.remove('hidden');
            $('otp-note').textContent = note;
            $('msg').textContent = '';
        }

        async function post(payload) {
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json().catch(() => ({}));
            return { res, data };
        }

        async function sendCode() {
            let out;
            try {
                out = await post({ action: 'register', email: pending.email, password: pending.password });
            } catch {
                return $('msg').textContent = 'Network error — could not reach the server.';
            }
            const { res, data } = out;
            if (!res.ok) return $('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
            showOtp(`Code sent to ${pending.email}`);
        }

        $('toggle').onclick = () => {
            isLogin = !isLogin;
            $('title').textContent = isLogin ? 'Login' : 'Register';
            $('btn').textContent = isLogin ? 'Login' : 'Register';
            $('toggle').textContent = isLogin ? 'Need an account? Register' : 'Already have an account? Login';
            $('msg').textContent = '';
        };

        $('form').onsubmit = async (e) => {
            e.preventDefault();
            const email = $('email').value;
            const password = $('password').value;
            pending = { email, password };

            let out;
            try {
                out = await post({ action: isLogin ? 'login' : 'register', email, password });
            } catch {
                return $('msg').textContent = 'Network error — could not reach the server.';
            }
            const { res, data } = out;

            if (res.ok) {
                if (isLogin) return loggedIn(data.token);
                return showOtp(`Code sent to ${email}`);
            }
            if (res.status === 403 && data.verify) return showOtp('Enter the code we emailed you.');
            $('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
        };

        $('otp-form').onsubmit = async (e) => {
            e.preventDefault();
            let out;
            try {
                out = await post({ action: 'verify', email: pending.email, otp: $('otp').value.trim() });
            } catch {
                return $('msg').textContent = 'Network error — could not reach the server.';
            }
            const { res, data } = out;
            if (res.ok) return loggedIn(data.token);
            $('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
        };

        $('resend').onclick = () => {
            if (pending) sendCode();
        };

        if (localStorage.getItem('token')) {
            $('auth-card').classList.add('hidden');
            $('dash').classList.remove('hidden');
        }
    </script>
</body>
</html>
