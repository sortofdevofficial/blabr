<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auth</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; color: #fff; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 8px; width: 300px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #6366f1; border: none; color: white; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card" id="auth-card">
        <h2 id="title">Login</h2>
        <form id="form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="btn">Login</button>
        </form>
        <p id="toggle" style="cursor:pointer; color:#aaa; text-align:center;">Need an account? Register</p>
        <p id="msg" style="color:red; text-align:center;"></p>
    </div>
    <div class="card hidden" id="dash">
        <h2>Logged In!</h2>
        <button onclick="localStorage.clear(); location.reload()">Logout</button>
    </div>
    <script>
        let isLogin = true;
        document.getElementById('toggle').onclick = () => {
            isLogin = !isLogin;
            document.getElementById('title').textContent = isLogin ? 'Login' : 'Register';
            document.getElementById('btn').textContent = isLogin ? 'Login' : 'Register';
            document.getElementById('toggle').textContent = isLogin ? 'Need an account? Register' : 'Already have an account? Login';
        };

        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            let res, data;
            try {
                res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: isLogin ? 'login' : 'register', email, password })
                });
                data = await res.json().catch(() => ({}));
            } catch {
                return document.getElementById('msg').textContent = 'Network error — could not reach the server.';
            }
            if (!res.ok) return document.getElementById('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
            if (isLogin) {
                localStorage.setItem('token', data.token);
                document.getElementById('auth-card').classList.add('hidden');
                document.getElementById('dash').classList.remove('hidden');
            } else {
                alert('Account created! Now login.');
                document.getElementById('toggle').click();
            }
        };

        if (localStorage.getItem('token')) {
            document.getElementById('auth-card').classList.add('hidden');
            document.getElementById('dash').classList.remove('hidden');
        }
    </script>
</body>
</html>
