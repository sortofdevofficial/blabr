<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/favicon.png?v=3">
    <link rel="stylesheet" href="/style.css">
    <title>pratr</title>
</head>
<body>
    <div class="card" id="auth-card">
        <div class="brand"><img src="/logo.png" alt="pratr"></div>
        <h2 id="title">Login</h2>
        <form id="form">
            <input type="email" id="email" placeholder="Email" autocomplete="email" required>
            <input type="text" id="username" class="hidden" placeholder="Username (optional)" maxlength="20" autocomplete="off" spellcheck="false">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit" id="btn">Login</button>
        </form>
        <form id="otp-form" class="hidden">
            <p id="otp-note"></p>
            <input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" spellcheck="false" required>
            <button type="submit">Verify</button>
            <p id="resend">Resend code</p>
        </form>
        <p id="toggle">Need an account? Register</p>
        <p id="msg"></p>
    </div>

    <div class="hidden" id="dash">
        <div class="dash-sidebar">
            <div class="sidebar-scroll">
                <div class="msgr-list-head"><strong>Servers</strong><span class="head-actions"><button type="button" id="server-create">+ Create</button></span></div>
                <div class="msgr-convos" id="dash-servers"></div>
                <div class="msgr-list-head"><strong>Messages</strong></div>
                <div class="msgr-convos" id="dash-convos"></div>
            </div>
            <div class="msgr-me" id="dash-me">
                <div class="fava" id="dash-me-ava"><span id="dash-me-initial">?</span></div>
                <div class="msgr-me-info">
                    <strong id="dash-me-name">@</strong>
                    <span id="dash-me-status">Online</span>
                </div>
                <button type="button" id="dash-me-logout" title="Log out">⏻</button>
            </div>
        </div>
        <div class="dash-main">
            <div class="dash-home" id="dash-home">
                <div class="brand small"><img src="/logo.png" alt="pratr"></div>
                <div class="dash-head">
                    <div class="avatar">
                        <span id="avatar-initial">?</span>
                        <span class="pdot on"></span>
                    </div>
                    <div class="dash-me">
                        <strong id="uname">@</strong>
                        <p id="who"></p>
                        <p id="bio" class="bio-line empty">No bio yet</p>
                    </div>
                </div>
                <h3>Active logins</h3>
                <div id="sessions"></div>
                <div class="hrow">
                    <h3>Friends</h3>
                </div>
                <div id="f-pane-all"></div>
                <button type="button" id="logout-btn">Logout</button>
            </div>

            <div class="msgr-thread hidden" id="dash-thread">
                <div class="msgr-head">
                    <button type="button" class="msgr-back" id="dash-back" aria-label="Back">←</button>
                    <div class="fava" id="chat-ava"><span id="chat-initial">?</span></div>
                    <div class="msgr-title">
                        <h2 id="chat-name">@</h2>
                        <p class="chat-status"><i class="pdot-mini on" id="chat-dot"></i><span id="chat-status">Online</span></p>
                    </div>
                    <div class="thread-actions hidden" id="server-actions">
                        <button type="button" id="server-members-btn" title="Server Members">👥 Members</button>
                        <button type="button" id="server-invite" class="hidden" title="Invite Friends">🔗 Invite</button>
                    </div>
                </div>
                <div class="thread-container">
                    <div class="channels-pane hidden" id="channels-pane">
                        <div class="channels-header">
                            <span id="channels-server-name">CHANNELS</span>
                            <button type="button" class="link" id="add-channel-btn" title="Create Text Channel">+</button>
                        </div>
                        <div class="channels-list" id="channels-list"></div>
                    </div>
                    <div class="thread-chat-pane">
                        <div class="chat-log" id="chat-log"></div>
                        <div class="msgr-composer">
                            <form id="chat-form">
                                <input id="chat-input" maxlength="2000" placeholder="Message…" autocomplete="off" required>
                                <button type="submit" id="chat-send">➤</button>
                            </form>
                        </div>
                    </div>
                    <div class="members-sidebar hidden" id="members-sidebar">
                        <div class="members-sidebar-header">
                            <span>Members — <span id="members-count">0</span></span>
                        </div>
                        <div class="members-sidebar-list" id="members-sidebar-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal hidden" id="channel-modal" role="dialog" aria-modal="true">
        <div class="modal-card">
            <button type="button" class="modal-close" id="channel-modal-close" aria-label="Close">×</button>
            <h2>Create Text Channel</h2>
            <form id="channel-create-form">
                <label for="new-channel-name">Channel Name</label>
                <input id="new-channel-name" placeholder="general" maxlength="40" required autocomplete="off">
                <label for="new-channel-cat" style="margin-top:8px; display:block;">Category</label>
                <input id="new-channel-cat" placeholder="TEXT CHANNELS" maxlength="40" autocomplete="off" value="TEXT CHANNELS">
                <p id="channel-modal-msg"></p>
                <div class="modal-actions" style="margin-top:12px;">
                    <button type="button" class="ghost" id="channel-modal-cancel">Cancel</button>
                    <button type="submit">Create</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal hidden" id="server-dialog" role="dialog" aria-modal="true">
        <div class="modal-card">
            <button type="button" class="modal-close" id="server-dialog-close" aria-label="Close">×</button>
            <h2 id="server-dialog-title">Server Settings</h2>
            <form id="server-create-form" class="hidden">
                <label for="server-name">Server name</label>
                <input id="server-name" maxlength="60" placeholder="My Server" autocomplete="off" required>
                <button type="submit" style="margin-top:10px;">Create server</button>
            </form>
            <div id="server-invite-panel" class="hidden">
                <p class="fhint">Anyone with this invite link can join your server.</p>
                <input id="server-invite-link" readonly>
                <div class="modal-actions" style="margin-top:10px;">
                    <button type="button" id="server-invite-copy">Copy link</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-stack" id="toast-stack"></div>
    <script src="/app.js"></script>
</body>
</html>
