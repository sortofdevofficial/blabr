<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/favicon.png?v=3">
    <link rel="apple-touch-icon" href="/favicon.png?v=3">
    <title>pratr</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; color: #f2f2f4; background: radial-gradient(1200px 600px at 50% -10%, #1b1b22 0%, #0e0e11 60%); }
        .card { background: #17171b; padding: 26px; border-radius: 16px; width: 100%; max-width: 320px; flex: 0 0 auto; margin: auto 0; border: 1px solid #26262d; box-shadow: 0 18px 40px rgba(0, 0, 0, .5); }
        #dash { max-width: 380px; position: relative; }
        img { -webkit-user-drag: none; user-select: none; }
        .brand { display: flex; justify-content: center; margin: 0 0 16px; }
        .brand img { width: 150px; height: 64px; object-fit: cover; object-position: 50% 31%; border-radius: 10px; display: block; }
        .brand.small { position: absolute; top: 18px; right: 18px; margin: 0; }
        .brand.small img { width: 78px; height: 30px; border-radius: 7px; }
        h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.015em; }
        h3 { font-size: 11px; color: #8b8b96; margin: 20px 0 4px; text-transform: uppercase; letter-spacing: .08em; }
        input, button { width: 100%; padding: 11px 12px; margin: 8px 0; font: inherit; border-radius: 9px; }
        input { background: #101014; border: 1px solid #2b2b33; color: #f2f2f4; outline: none; transition: border-color .15s, box-shadow .15s; }
        input::placeholder { color: #6b6b76; }
        input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, .18); }
        button { background: #6366f1; border: none; color: #fff; font-weight: 600; cursor: pointer; transition: background .15s, transform .06s; }
        button:hover { background: #5457e5; }
        button:active { transform: translateY(1px); }
        button:disabled { opacity: .6; cursor: default; }
        .hidden { display: none !important; }
        #toggle, #resend, #otp-note { color: #8b8b96; text-align: center; font-size: 13px; }
        #toggle { cursor: pointer; margin: 10px 0 0; transition: color .15s; }
        #toggle:hover { color: #c9c9d4; }
        #resend { cursor: pointer; color: #6366f1; margin: 10px 0 0; }
        #resend:hover { text-decoration: underline; }
        #otp-note { margin: 0 0 10px; }
        #msg { color: #ff6b6b; text-align: center; font-size: 13px; margin: 8px 0 0; min-height: 18px; }

        .dash-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; padding-right: 86px; }
        .dash-head h2 { margin: 0 0 2px; font-size: 17px; }
        .dash-head #who { margin: 0; text-align: left; color: #8b8b96; font-size: 12.5px; word-break: break-all; }
        .avatar { position: relative; width: 64px; height: 64px; margin: 0; padding: 0; flex: 0 0 auto; border-radius: 50%; overflow: hidden; border: 2px solid #2b2b33; background: linear-gradient(135deg, #6366f1, #8b5cf6); font-size: 24px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
        .avatar:hover { border-color: #4d4d5a; }
        .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
        .avatar img.hidden { display: none; }
        .avatar .edit { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .55); color: #fff; font-size: 11px; font-weight: 500; opacity: 0; transition: opacity .15s; }
        .avatar:focus-visible .edit { opacity: 1; }
        @media (hover: hover) {
            .avatar:hover .edit { opacity: 1; }
        }

        .sess { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid #24242b; padding: 9px 0; }
        .sess:first-child { border-top: none; }
        .sess strong { display: block; font-size: 12.5px; font-weight: 600; }
        .sess .meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; color: #8b8b96; font-size: 12px; }
        .sess .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #101014; background: #101014; border: 1px solid #101014; border-radius: 4px; padding: 1px 5px; transition: color .15s, background .15s, border-color .15s; }
        .sess .ip.revealed { color: #c9c9d4; background: #24242b; border-color: #2f2f38; }
        .sess button { width: auto; margin: 0; padding: 5px 9px; font-size: 11px; border-radius: 7px; }
        .sess button.ghost { background: #24242b; color: #c9c9d4; font-weight: 500; }
        .sess button.ghost:hover { background: #2f2f38; }

        #friend-form { display: flex; gap: 8px; }
        #friend-form input { flex: 1; min-width: 0; }
        #friend-form button { width: auto; padding: 0 14px; font-size: 12.5px; white-space: nowrap; }
        #friend-msg { color: #ff6b6b; text-align: center; font-size: 12px; margin: 6px 0 0; min-height: 16px; }
        .frow { display: flex; align-items: center; gap: 10px; border-top: 1px solid #24242b; padding: 9px 0; }
        .frow:first-child { border-top: none; }
        .fava { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
        .fava img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .finfo { flex: 1; min-width: 0; }
        .finfo strong { display: block; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .finfo span { font-size: 11.5px; color: #8b8b96; }
        .frow button { width: auto; margin: 0; padding: 5px 9px; font-size: 11px; border-radius: 7px; }
        .frow button.ghost { background: #24242b; color: #c9c9d4; font-weight: 500; }
        .frow button.ghost:hover { background: #2f2f38; }
        .fempty { color: #6b6b76; font-size: 12px; margin: 2px 0 0; }

        .modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; background: rgba(0, 0, 0, .72); backdrop-filter: blur(2px); }
        .modal-card { position: relative; background: #17171b; border: 1px solid #2b2b33; border-radius: 16px; padding: 20px; width: 100%; max-width: 360px; margin: auto; box-shadow: 0 24px 60px rgba(0, 0, 0, .6); }
        .modal-card h2 { margin: 0 0 14px; font-size: 17px; padding-right: 34px; }
        .modal-close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; margin: 0; padding: 0; border-radius: 8px; background: #24242b; color: #c9c9d4; font-size: 18px; font-weight: 400; line-height: 1; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: #2f2f38; }
        .crop-stage { display: flex; justify-content: center; margin-bottom: 12px; }
        #crop-canvas { width: 100%; max-width: min(280px, 46vh); height: auto; display: block; border-radius: 12px; cursor: grab; touch-action: none; }
        #crop-canvas:active { cursor: grabbing; }
        #crop-zoom { padding: 0; margin: 0 0 12px; height: 22px; background: none; border: none; box-shadow: none; accent-color: #6366f1; cursor: pointer; }
        #crop-zoom:focus { box-shadow: none; }
        #crop-msg { color: #ff6b6b; text-align: center; font-size: 12.5px; margin: 0 0 10px; min-height: 16px; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { margin: 0; }
        .modal-actions .ghost { background: #24242b; color: #c9c9d4; }
        .modal-actions .ghost:hover { background: #2f2f38; }
        .file-input { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
    </style>
</head>
<body>
    <div class="card" id="auth-card">
        <div class="brand"><img src="/logo.png" alt="pratr"></div>
        <h2 id="title">Login</h2>
        <form id="form">
            <input type="email" id="email" placeholder="Email" autocomplete="email" required>
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit" id="btn">Login</button>
        </form>
        <form id="otp-form" class="hidden">
            <p id="otp-note"></p>
            <input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" spellcheck="false" required>
            <button type="submit">Verify</button>
            <p id="resend">Resend code</p>
        </form>
        <p id="toggle">Need an account? Register</p>
        <p id="msg"></p>
    </div>
    <div class="card hidden" id="dash">
        <div class="brand small"><img src="/logo.png" alt="pratr"></div>
        <div class="dash-head">
            <button type="button" class="avatar" id="avatar-btn" title="Change profile photo">
                <img id="avatar-img" alt="Profile photo" class="hidden">
                <span id="avatar-initial">?</span>
                <span class="edit">Edit</span>
            </button>
            <div>
                <h2>Logged in</h2>
                <p id="who"></p>
            </div>
        </div>
        <input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp" class="file-input">
        <h3>Active logins</h3>
        <div id="sessions"></div>
        <h3>Friends</h3>
        <form id="friend-form">
            <input type="email" id="friend-email" placeholder="Add friend by email" autocomplete="email" required>
            <button type="submit" id="friend-add">Add</button>
        </form>
        <p id="friend-msg"></p>
        <div id="friend-in"></div>
        <div id="friend-list"></div>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="modal hidden" id="crop">
        <div class="modal-card">
            <button type="button" class="modal-close" id="crop-close" aria-label="Close">×</button>
            <h2>Change profile photo</h2>
            <div class="crop-stage">
                <canvas id="crop-canvas" width="320" height="320"></canvas>
            </div>
            <input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1">
            <p id="crop-msg"></p>
            <div class="modal-actions">
                <button type="button" class="ghost" id="crop-cancel">Cancel</button>
                <button type="button" id="crop-save">Save</button>
            </div>
        </div>
    </div>

    <script>
        let isLogin = true;
        let pending = null;
        let crop = null;
        let drag = null;
        const P = 320;
        const $ = (id) => document.getElementById(id);

        function loggedIn(token, email) {
            localStorage.setItem('token', token);
            if (email) localStorage.setItem('email', email);
            showDash();
        }

        function clearAuth() {
            localStorage.clear();
            location.reload();
        }

        function ago(t) {
            const d = Math.floor(Date.now() / 1000) - t;
            if (d < 60) return 'just now';
            if (d < 3600) return `${Math.floor(d / 60)}m ago`;
            if (d < 86400) return `${Math.floor(d / 3600)}h ago`;
            return `${Math.floor(d / 86400)}d ago`;
        }

        function setWho(email) {
            if (email) localStorage.setItem('email', email);
            const e = localStorage.getItem('email') || '';
            $('who').textContent = e;
            $('avatar-initial').textContent = (e[0] || '?').toUpperCase();
        }

        function setAvatar(url) {
            const img = $('avatar-img');
            if (url) {
                img.onerror = () => setAvatar(null);
                img.src = url;
                img.classList.remove('hidden');
                $('avatar-initial').classList.add('hidden');
            } else {
                img.onerror = null;
                img.removeAttribute('src');
                img.classList.add('hidden');
                $('avatar-initial').classList.remove('hidden');
            }
        }

        function showDash() {
            $('auth-card').classList.add('hidden');
            $('dash').classList.remove('hidden');
            setWho();
            setAvatar(null);
            loadSessions();
            loadFriends();
        }

        function renderSessions(list) {
            const box = $('sessions');
            box.textContent = '';
            list.forEach((s) => {
                const row = document.createElement('div');
                row.className = 'sess';

                const info = document.createElement('div');
                const name = document.createElement('strong');
                name.textContent = s.device + (s.current ? ' · this device' : '');

                const meta = document.createElement('div');
                meta.className = 'meta';

                const ip = document.createElement('span');
                ip.className = 'ip';
                ip.textContent = s.ip;

                const show = document.createElement('button');
                show.type = 'button';
                show.className = 'ghost';
                show.textContent = 'Show';
                show.onclick = () => {
                    const on = ip.classList.toggle('revealed');
                    show.textContent = on ? 'Hide' : 'Show';
                };

                const when = document.createElement('span');
                when.textContent = ago(s.last);

                meta.append(ip, show, when);
                info.append(name, meta);

                const btn = document.createElement('button');
                btn.textContent = 'Log out';
                btn.onclick = () => revokeSession(s.id);

                row.append(info, btn);
                box.append(row);
            });
        }

        async function loadSessions() {
            let out;
            try {
                out = await post({ action: 'sessions' }, localStorage.getItem('token'));
            } catch {
                $('sessions').textContent = 'Network error — could not load devices.';
                return;
            }
            if (out.res.status === 401) return clearAuth();
            if (!out.res.ok) {
                $('sessions').textContent = out.data.error || 'Could not load devices.';
                return;
            }
            if (out.data.email) setWho(out.data.email);
            setAvatar(out.data.avatar);
            renderSessions(out.data.sessions);
        }

        async function revokeSession(id) {
            let out;
            try {
                out = await post({ action: 'revoke', id }, localStorage.getItem('token'));
            } catch {
                return alert('Network error — could not log out that device.');
            }
            if (out.res.status === 401) return clearAuth();
            if (!out.res.ok) return alert(out.data.error || 'Could not log out that device.');
            if (out.data.current) return clearAuth();
            loadSessions();
        }

        async function loadFriends() {
            let out;
            try {
                out = await post({ action: 'friends' }, localStorage.getItem('token'));
            } catch {
                $('friend-msg').textContent = 'Network error — could not load friends.';
                return;
            }
            if (out.res.status === 401) return clearAuth();
            if (!out.res.ok) {
                $('friend-msg').textContent = out.data.error || 'Could not load friends.';
                return;
            }
            renderFriends(out.data);
        }

        function friendAvatar(u) {
            const av = document.createElement('div');
            av.className = 'fava';
            av.textContent = (u.email[0] || '?').toUpperCase();
            if (u.avatar) {
                const img = document.createElement('img');
                img.alt = '';
                img.onerror = () => {
                    img.remove();
                    av.textContent = (u.email[0] || '?').toUpperCase();
                };
                img.src = u.avatar;
                av.textContent = '';
                av.append(img);
            }
            return av;
        }

        function friendRow(u, actions, sub) {
            const row = document.createElement('div');
            row.className = 'frow';

            const info = document.createElement('div');
            info.className = 'finfo';
            const name = document.createElement('strong');
            name.textContent = u.email;
            info.append(name);
            if (sub) {
                const note = document.createElement('span');
                note.textContent = sub;
                info.append(note);
            }

            row.append(friendAvatar(u), info);
            actions.forEach((a) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = a.label;
                if (a.ghost) b.className = 'ghost';
                b.onclick = a.onclick;
                row.append(b);
            });
            return row;
        }

        function emptyNote(box, text) {
            if (box.children.length) return;
            const p = document.createElement('p');
            p.className = 'fempty';
            p.textContent = text;
            box.append(p);
        }

        function renderFriends(data) {
            const reqBox = $('friend-in');
            const listBox = $('friend-list');
            reqBox.textContent = '';
            listBox.textContent = '';

            (data.incoming || []).forEach((u) => {
                reqBox.append(friendRow(u, [
                    { label: 'Accept', onclick: () => respondFriend(u.id, true) },
                    { label: 'Deny', ghost: true, onclick: () => respondFriend(u.id, false) }
                ], 'wants to be friends'));
            });
            (data.outgoing || []).forEach((u) => {
                reqBox.append(friendRow(u, [
                    { label: 'Cancel', ghost: true, onclick: () => removeFriend(u.id) }
                ], `Requested ${ago(u.t)}`));
            });
            (data.friends || []).forEach((u) => {
                listBox.append(friendRow(u, [
                    { label: 'Remove', ghost: true, onclick: () => removeFriend(u.id) }
                ]));
            });

            emptyNote(reqBox, 'No pending requests.');
            emptyNote(listBox, 'No friends yet.');
        }

        async function respondFriend(id, accept) {
            let out;
            try {
                out = await post({ action: 'respond', id, accept }, localStorage.getItem('token'));
            } catch {
                return $('friend-msg').textContent = 'Network error — try again.';
            }
            if (out.res.status === 401) return clearAuth();
            if (!out.res.ok) return $('friend-msg').textContent = out.data.error || 'Could not update the request.';
            $('friend-msg').textContent = '';
            loadFriends();
        }

        async function removeFriend(id) {
            let out;
            try {
                out = await post({ action: 'remove', id }, localStorage.getItem('token'));
            } catch {
                return $('friend-msg').textContent = 'Network error — try again.';
            }
            if (out.res.status === 401) return clearAuth();
            if (!out.res.ok) return $('friend-msg').textContent = out.data.error || 'Could not remove.';
            $('friend-msg').textContent = '';
            loadFriends();
        }

        async function logout() {
            await post({ action: 'revoke' }, localStorage.getItem('token')).catch(() => {});
            clearAuth();
        }

        function showOtp(note) {
            $('form').classList.add('hidden');
            $('toggle').classList.add('hidden');
            $('otp-form').classList.remove('hidden');
            $('otp-note').textContent = note;
            $('msg').textContent = '';
        }

        async function post(payload, token) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers.Authorization = `Bearer ${token}`;
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 20000);
            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(payload),
                    signal: ctrl.signal
                });
                const data = await res.json().catch(() => ({}));
                return { res, data };
            } finally {
                clearTimeout(timer);
            }
        }

        function clampOffset() {
            const s = Math.max(P / crop.img.width, P / crop.img.height) * crop.zoom;
            const mx = Math.max(0, (crop.img.width * s - P) / 2);
            const my = Math.max(0, (crop.img.height * s - P) / 2);
            crop.x = Math.min(mx, Math.max(-mx, crop.x));
            crop.y = Math.min(my, Math.max(-my, crop.y));
        }

        function drawCrop() {
            const ctx = $('crop-canvas').getContext('2d');
            const { img, zoom, x, y } = crop;
            const s = Math.max(P / img.width, P / img.height) * zoom;
            const w = img.width * s;
            const h = img.height * s;

            ctx.clearRect(0, 0, P, P);

            ctx.save();
            ctx.beginPath();
            ctx.arc(P / 2, P / 2, P / 2, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(img, (P - w) / 2 + x, (P - h) / 2 + y, w, h);
            ctx.restore();

            ctx.beginPath();
            ctx.rect(0, 0, P, P);
            ctx.arc(P / 2, P / 2, P / 2 - 1, 0, Math.PI * 2, true);
            ctx.fillStyle = 'rgba(8, 8, 12, .68)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(P / 2, P / 2, P / 2 - 1, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, .18)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function setZoom(z) {
            if (!crop) return;
            crop.zoom = Math.min(3, Math.max(1, z));
            $('crop-zoom').value = crop.zoom;
            clampOffset();
            drawCrop();
        }

        function openCrop(file) {
            if (!file) return;
            if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return alert('Pick a PNG, JPG or WebP image.');
            if (file.size > 15 * 1024 * 1024) return alert('That image is over 15 MB. Pick a smaller one.');

            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                crop = { img, zoom: 1, x: 0, y: 0, url };
                $('crop-zoom').value = 1;
                $('crop-msg').textContent = '';
                $('crop').classList.remove('hidden');
                drawCrop();
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                alert('Could not read that image. Try a PNG or JPG.');
            };
            img.src = url;
        }

        function closeCrop() {
            $('crop').classList.add('hidden');
            if (crop) URL.revokeObjectURL(crop.url);
            crop = null;
            drag = null;
            $('avatar-file').value = '';
        }

        async function saveCrop() {
            if (!crop) return;

            const btn = $('crop-save');
            btn.disabled = true;
            btn.textContent = 'Saving…';
            $('crop-msg').textContent = '';

            let image;
            try {
                const out = document.createElement('canvas');
                out.width = out.height = 512;
                const ctx = out.getContext('2d');
                const s = Math.max(512 / crop.img.width, 512 / crop.img.height) * crop.zoom;
                const w = crop.img.width * s;
                const h = crop.img.height * s;
                const k = 512 / P;
                ctx.drawImage(crop.img, (512 - w) / 2 + crop.x * k, (512 - h) / 2 + crop.y * k, w, h);
                image = out.toDataURL('image/jpeg', 0.9);
            } catch {
                btn.disabled = false;
                btn.textContent = 'Save';
                return $('crop-msg').textContent = 'Could not prepare that image. Try another one.';
            }

            let res;
            try {
                res = await post({ action: 'avatar', image }, localStorage.getItem('token'));
            } catch {
                btn.disabled = false;
                btn.textContent = 'Save';
                return $('crop-msg').textContent = 'Network error — could not upload.';
            }

            btn.disabled = false;
            btn.textContent = 'Save';

            if (res.res.status === 401) return clearAuth();
            if (!res.res.ok) return $('crop-msg').textContent = res.data.hint || res.data.error || `Upload failed (${res.res.status}).`;
            if (!res.data.url) return $('crop-msg').textContent = 'The server did not return an image URL.';

            setAvatar(res.data.url);
            closeCrop();
        }

        $('avatar-btn').onclick = () => $('avatar-file').click();
        $('avatar-file').onchange = (e) => openCrop(e.target.files[0]);
        $('crop-cancel').onclick = closeCrop;
        $('crop-close').onclick = closeCrop;
        $('crop-save').onclick = saveCrop;
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        $('crop-zoom').oninput = (e) => setZoom(Number(e.target.value));
        $('crop').onclick = (e) => { if (e.target === $('crop')) closeCrop(); };
        document.onkeydown = (e) => { if (e.key === 'Escape' && !$('crop').classList.contains('hidden')) closeCrop(); };

        const canvas = $('crop-canvas');
        canvas.onpointerdown = (e) => {
            if (!crop) return;
            drag = { px: e.clientX, py: e.clientY, x: crop.x, y: crop.y };
            canvas.setPointerCapture(e.pointerId);
        };
        canvas.onpointermove = (e) => {
            if (!crop || !drag) return;
            const k = P / canvas.getBoundingClientRect().width;
            crop.x = drag.x + (e.clientX - drag.px) * k;
            crop.y = drag.y + (e.clientY - drag.py) * k;
            clampOffset();
            drawCrop();
        };
        canvas.onpointerup = canvas.onpointercancel = () => { drag = null; };
        canvas.onwheel = (e) => {
            if (!crop) return;
            e.preventDefault();
            setZoom(crop.zoom - e.deltaY * 0.0015);
        };

        async function sendCode() {
            let out;
            try {
                out = await post({ action: 'register', email: pending.email, password: pending.password });
            } catch {
                return $('msg').textContent = 'Network error — could not reach the server.';
            }
            const { res, data } = out;
            if (!res.ok) return $('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
            showOtp(`Code sent to ${pending.email}`);
        }

        $('toggle').onclick = () => {
            isLogin = !isLogin;
            $('title').textContent = isLogin ? 'Login' : 'Register';
            $('btn').textContent = isLogin ? 'Login' : 'Register';
            $('toggle').textContent = isLogin ? 'Need an account? Register' : 'Already have an account? Login';
            $('msg').textContent = '';
        };

        $('form').onsubmit = async (e) => {
            e.preventDefault();
            const email = $('email').value;
            const password = $('password').value;
            pending = { email, password };

            let out;
            try {
                out = await post({ action: isLogin ? 'login' : 'register', email, password });
            } catch {
                return $('msg').textContent = 'Network error — could not reach the server.';
            }
            const { res, data } = out;

            if (res.ok) {
                if (isLogin) return loggedIn(data.token, data.email);
                return showOtp(`Code sent to ${email}`);
            }
            if (res.status === 403 && data.verify) return showOtp('Enter the code we emailed you.');
            $('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
        };

        $('otp-form').onsubmit = async (e) => {
            e.preventDefault();
            let out;
            try {
                out = await post({ action: 'verify', email: pending.email, otp: $('otp').value.trim() });
            } catch {
                return $('msg').textContent = 'Network error — could not reach the server.';
            }
            const { res, data } = out;
            if (res.ok) return loggedIn(data.token, data.email);
            $('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
        };

        $('resend').onclick = () => {
            if (pending) sendCode();
        };

        $('friend-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = $('friend-email').value.trim();
            if (!email) return;
            $('friend-msg').textContent = '';

            let out;
            try {
                out = await post({ action: 'request', email }, localStorage.getItem('token'));
            } catch {
                return $('friend-msg').textContent = 'Network error — try again.';
            }
            if (out.res.status === 401) return clearAuth();
            if (!out.res.ok) return $('friend-msg').textContent = out.data.error || 'Could not send the request.';

            $('friend-email').value = '';
            loadFriends();
        };

        if (localStorage.getItem('token')) showDash();
    </script>
</body>
</html>
