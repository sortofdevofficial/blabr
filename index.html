<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auth</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; color: #f2f2f4; background: radial-gradient(1200px 600px at 50% -10%, #1b1b22 0%, #0e0e11 60%); }
        .card { background: #17171b; padding: 26px; border-radius: 14px; width: 100%; max-width: 320px; flex: 0 0 auto; border: 1px solid #26262d; box-shadow: 0 18px 40px rgba(0, 0, 0, .5); }
        h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.015em; }
        h3 { font-size: 11px; color: #8b8b96; margin: 20px 0 4px; text-transform: uppercase; letter-spacing: .08em; }
        input, button { width: 100%; padding: 11px 12px; margin: 8px 0; font: inherit; border-radius: 9px; }
        input { background: #101014; border: 1px solid #2b2b33; color: #f2f2f4; outline: none; transition: border-color .15s, box-shadow .15s; }
        input::placeholder { color: #6b6b76; }
        input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, .18); }
        button { background: #6366f1; border: none; color: #fff; font-weight: 600; cursor: pointer; transition: background .15s, transform .06s; }
        button:hover { background: #5457e5; }
        button:active { transform: translateY(1px); }
        .hidden { display: none; }
        #toggle, #resend, #otp-note { color: #8b8b96; text-align: center; font-size: 13px; }
        #toggle { cursor: pointer; margin: 10px 0 0; transition: color .15s; }
        #toggle:hover { color: #c9c9d4; }
        #resend { cursor: pointer; color: #6366f1; margin: 10px 0 0; }
        #resend:hover { text-decoration: underline; }
        #otp-note { margin: 0 0 10px; }
        #msg { color: #ff6b6b; text-align: center; font-size: 13px; margin: 8px 0 0; min-height: 18px; }
        #who { color: #8b8b96; font-size: 13px; text-align: center; margin: 0; }
        .sess { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid #24242b; padding: 9px 0; }
        .sess:first-child { border-top: none; }
        .sess strong { display: block; font-size: 12.5px; font-weight: 600; }
        .sess .meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; color: #8b8b96; font-size: 12px; }
        .sess .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #101014; background: #101014; border: 1px solid #101014; border-radius: 4px; padding: 1px 5px; transition: color .15s, background .15s, border-color .15s; }
        .sess .ip.revealed { color: #c9c9d4; background: #24242b; border-color: #2f2f38; }
        .sess button { width: auto; margin: 0; padding: 5px 9px; font-size: 11px; border-radius: 7px; }
        .sess button.ghost { background: #24242b; color: #c9c9d4; font-weight: 500; }
        .sess button.ghost:hover { background: #2f2f38; }
    </style>
</head>
<body>
    <div class="card" id="auth-card">
        <h2 id="title">Login</h2>
        <form id="form">
            <input type="email" id="email" placeholder="Email" autocomplete="email" required>
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit" id="btn">Login</button>
        </form>
        <form id="otp-form" class="hidden">
            <p id="otp-note"></p>
            <input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" spellcheck="false" required>
            <button type="submit">Verify</button>
            <p id="resend">Resend code</p>
        </form>
        <p id="toggle">Need an account? Register</p>
        <p id="msg"></p>
    </div>
    <div class="card hidden" id="dash">
        <h2>Logged In!</h2>
        <p id="who"></p>
        <h3>Active logins</h3>
        <div id="sessions"></div>
        <button onclick="logout()">Logout</button>
    </div>
    <script>
        let isLogin = true;
        let pending = null;
        const $ = (id) => document.getElementById(id);

        function loggedIn(token, email) {
            localStorage.setItem('token', token);
            if (email) localStorage.setItem('email', email);
            showDash();
        }

        function clearAuth() {
            localStorage.clear();
            location.reload();
        }

        function ago(t) {
            const d = Math.floor(Date.now() / 1000) - t;
            if (d < 60) return 'just now';
            if (d < 3600) return `${Math.floor(d / 60)}m ago`;
            if (d < 86400) return `${Math.floor(d / 3600)}h ago`;
            return `${Math.floor(d / 86400)}d ago`;
        }

        function showDash() {
            $('auth-card').classList.add('hidden');
            $('dash').classList.remove('hidden');
            $('who').textContent = localStorage.getItem('email') || '';
            loadSessions();
        }

        function renderSessions(list) {
            const box = $('sessions');
            box.textContent = '';
            list.forEach((s) => {
                const row = document.createElement('div');
                row.className = 'sess';

                const info = document.createElement('div');
                const name = document.createElement('strong');
                name.textContent = s.device + (s.current ? ' · this device' : '');

                const meta = document.createElement('div');
                meta.className = 'meta';

                const ip = document.createElement('span');
                ip.className = 'ip';
                ip.textContent = s.ip;

                const show = document.createElement('button');
                show.type = 'button';
                show.className = 'ghost';
                show.textContent = 'Show';
                show.onclick = () => {
                    const on = ip.classList.toggle('revealed');
                    show.textContent = on ? 'Hide' : 'Show';
                };

                const when = document.createElement('span');
                when.textContent = ago(s.last);

                meta.append(ip, show, when);
                info.append(name, meta);

                const btn = document.createElement('button');
                btn.textContent = 'Log out';
                btn.onclick = () => revokeSession(s.id);

                row.append(info, btn);
                box.append(row);
            });
        }

        async function loadSessions() {
            let out;
            try {
                out = await post({ action: 'sessions' }, localStorage.getItem('token'));
            } catch {
                $('sessions').textContent = 'Network error — could not load devices.';
                return;
            }
            if (out.res.status === 401) return clearAuth();
            if (!out.res.ok) {
                $('sessions').textContent = out.data.error || 'Could not load devices.';
                return;
            }
            renderSessions(out.data.sessions);
        }

        async function revokeSession(id) {
            let out;
            try {
                out = await post({ action: 'revoke', id }, localStorage.getItem('token'));
            } catch {
                return alert('Network error — could not log out that device.');
            }
            if (out.res.status === 401) return clearAuth();
            if (!out.res.ok) return alert(out.data.error || 'Could not log out that device.');
            if (out.data.current) return clearAuth();
            loadSessions();
        }

        async function logout() {
            await post({ action: 'revoke' }, localStorage.getItem('token')).catch(() => {});
            clearAuth();
        }

        function showOtp(note) {
            $('form').classList.add('hidden');
            $('toggle').classList.add('hidden');
            $('otp-form').classList.remove('hidden');
            $('otp-note').textContent = note;
            $('msg').textContent = '';
        }

        async function post(payload, token) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers.Authorization = `Bearer ${token}`;
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers,
                body: JSON.stringify(payload)
            });
            const data = await res.json().catch(() => ({}));
            return { res, data };
        }

        async function sendCode() {
            let out;
            try {
                out = await post({ action: 'register', email: pending.email, password: pending.password });
            } catch {
                return $('msg').textContent = 'Network error — could not reach the server.';
            }
            const { res, data } = out;
            if (!res.ok) return $('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
            showOtp(`Code sent to ${pending.email}`);
        }

        $('toggle').onclick = () => {
            isLogin = !isLogin;
            $('title').textContent = isLogin ? 'Login' : 'Register';
            $('btn').textContent = isLogin ? 'Login' : 'Register';
            $('toggle').textContent = isLogin ? 'Need an account? Register' : 'Already have an account? Login';
            $('msg').textContent = '';
        };

        $('form').onsubmit = async (e) => {
            e.preventDefault();
            const email = $('email').value;
            const password = $('password').value;
            pending = { email, password };

            let out;
            try {
                out = await post({ action: isLogin ? 'login' : 'register', email, password });
            } catch {
                return $('msg').textContent = 'Network error — could not reach the server.';
            }
            const { res, data } = out;

            if (res.ok) {
                if (isLogin) return loggedIn(data.token, data.email);
                return showOtp(`Code sent to ${email}`);
            }
            if (res.status === 403 && data.verify) return showOtp('Enter the code we emailed you.');
            $('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
        };

        $('otp-form').onsubmit = async (e) => {
            e.preventDefault();
            let out;
            try {
                out = await post({ action: 'verify', email: pending.email, otp: $('otp').value.trim() });
            } catch {
                return $('msg').textContent = 'Network error — could not reach the server.';
            }
            const { res, data } = out;
            if (res.ok) return loggedIn(data.token, data.email);
            $('msg').textContent = data.hint || data.error || `Request failed (${res.status})`;
        };

        $('resend').onclick = () => {
            if (pending) sendCode();
        };

        if (localStorage.getItem('token')) showDash();
    </script>
</body>
</html>
